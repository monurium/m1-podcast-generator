name: Migros OneCast AI Generator & RSS Publisher

on:
  workflow_dispatch:
    inputs:
      tts_engine:
        description: 'TTS Motoru (gemini veya edge)'
        type: choice
        default: 'gemini'
        options:
          - gemini
          - edge

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    name: Generate and Publish Migros OneCast AI Episode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Migros OneCast AI Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TTS_ENGINE: ${{ inputs.tts_engine || secrets.TTS_ENGINE || 'gemini' }}
          PODCAST_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python main.py --tts ${{ inputs.tts_engine || 'gemini' }}

      - name: Commit and Push Updated Audio, Feed & Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ episodes/ podcast.xml episodes_manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate Migros OneCast AI daily episode & update RSS feed [skip ci]" && git push)
